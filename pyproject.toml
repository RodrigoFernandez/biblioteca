[project]
name = "biblioteca"
version = "0.0.1"
description = "Gestion de inventario de libros via procesamiento de imagenes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "python-telegram-bot>=20.0",
    "httpx>=0.27",
    "opencv-python-headless>=4.9",
    "pyzbar>=0.1.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
dev = ["pytest", "ruff"]

[project.scripts]
api = "app.api:main"
bot = "app.bot:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
